<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SolidSmurfs: an isometric cube in blues with an S on each side face, on Wagner navy -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4486"/>
      <stop offset="1" stop-color="#14265a"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd6ff"/>
      <stop offset="1" stop-color="#7fb0ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7cf0"/>
      <stop offset="1" stop-color="#1f4fc0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5fd6"/>
      <stop offset="1" stop-color="#173a96"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.3" fill="none" stroke="#c8d2e1" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M32 8 L54 19 L32 30 L10 19 Z" fill="url(#top)"/>
  <path d="M10 19 L32 30 L32 56 L10 45 Z" fill="url(#left)"/>
  <path d="M54 19 L32 30 L32 56 L54 45 Z" fill="url(#right)"/>
  <!-- an S on each side face, drawn in that face's plane -->
  <!-- (drawn as strokes, not text, so every SVG renderer, the icon maker included, shows it the same) -->
  <g fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path transform="matrix(1 0.5 0 1 10 19)" d="M15.6 7.4 C14.6 5.6 12.9 4.8 11 4.8 C8.2 4.8 6.4 6.4 6.4 8.6 C6.4 13.4 15.8 11.8 15.8 17.2 C15.8 19.8 13.6 21.4 10.8 21.4 C8.6 21.4 6.8 20.4 6 18.6"/>
    <path transform="matrix(1 -0.5 0 1 32 30)" d="M15.6 7.4 C14.6 5.6 12.9 4.8 11 4.8 C8.2 4.8 6.4 6.4 6.4 8.6 C6.4 13.4 15.8 11.8 15.8 17.2 C15.8 19.8 13.6 21.4 10.8 21.4 C8.6 21.4 6.8 20.4 6 18.6"/>
  </g>
  <path d="M10 19 L32 30 L54 19 M32 30 L32 56" stroke="#e6efff" stroke-opacity=".75" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <path d="M32 8 L54 19 L54 45 L32 56 L10 45 L10 19 Z" stroke="#0d1a40" stroke-opacity=".5" stroke-width="1" fill="none" stroke-linejoin="round"/>
</svg>
