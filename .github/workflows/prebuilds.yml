# Builds SolidSmurfs for each platform and checks each build. Pushing a v* tag also publishes them as a release, which is
# as private as the repo. Bundles go straight to the release: they'd overrun a free plan's artifact storage.
name: Prebuilds

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/prebuilds.yml"
      - "requirements.txt"
      - "tools/check_prebuild.py"
      - "tools/solidsmurfs.spec"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Start a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "SolidSmurfs $GITHUB_REF_NAME" --notes "$(cat <<'EOF'
          Internal builds: keep this repository and these files private.

          - **Windows:** unzip and run `SolidSmurfs.exe`. It isn't signed, so SmartScreen may ask first (More info, Run anyway).
          - **macOS (14 or newer):** unzip, then run `xattr -cr SolidSmurfs.app` once, because it isn't notarized. Pick `arm64` for Apple Silicon, `x64` for Intel.
          - **Linux (x64, glibc 2.35 or newer):** untar and run `SolidSmurfs/SolidSmurfs`.

          These builds leave out the third-party decoder for Adobe's private U3D mesh (see `solidsmufs/formats/u3d/vendor/README.md`), so 3D PDFs using that mesh report it as unreadable. Run from source to read them.

          The builds don't change file associations.
          EOF
          )"

  build:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 } # the oldest glibc PySide6 runs on, so the build runs on most distributions
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the libraries Qt and gmsh need
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglu1-mesa libxft2 libxcursor1 libxinerama1 libxrender1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 libnspr4 libasound2 libdbus-1-3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxi6 libxkbfile1 libfontconfig1 libglib2.0-0
      - name: Install the dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pillow
      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
      - name: Build
        run: pyinstaller --noconfirm tools/solidsmurfs.spec
      - name: Check the build
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python tools/check_prebuild.py "picture-${{ matrix.name }}.png"
          else
            python tools/check_prebuild.py "picture-${{ matrix.name }}.png"
          fi
      - name: Pack
        id: pack
        run: |
          case "$RUNNER_OS" in
            Windows) out="SolidSmurfs-${{ matrix.name }}.zip"; (cd dist && 7z a -tzip -bd "../$out" SolidSmurfs >/dev/null) ;;
            macOS) out="SolidSmurfs-${{ matrix.name }}.zip"; ditto -c -k --sequesterRsrc --keepParent dist/SolidSmurfs.app "$out" ;;
            *) out="SolidSmurfs-${{ matrix.name }}.tar.gz"; tar -C dist -czf "$out" SolidSmurfs ;;
          esac
          ls -lh "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: picture-${{ matrix.name }}
          path: picture-${{ matrix.name }}.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
